name: Checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness and project checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test failure detection and fixture validation
        run: python3 -m unittest discover -s tests -v
      - name: Check Python tool syntax
        run: python3 -m compileall -q tools tests
      - name: Check project metadata and library source boundary
        run: python3 tools/check_project.py
