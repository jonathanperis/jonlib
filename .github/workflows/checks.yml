name: Checks

# Pushes and pull requests run on Linux only while the port is being completed
# (docs/CI.md); the nightly and manual runs also use macOS.
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness and project checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test failure detection and fixture validation
        run: python3 -m unittest discover -s tests -v
      - name: Check Python tool syntax
        run: python3 -m compileall -q tools tests
      - name: Check project metadata and library source boundary
        run: python3 tools/check_project.py
