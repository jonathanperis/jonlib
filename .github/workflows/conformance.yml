name: Conformance

# Every gate in tools/gates.json runs on both OSes, split into balanced shards by
# tools/run_gates.py. Documentation-only changes do not need the native toolchain.
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['docs/**', '**/*.md', 'LICENSES/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSES/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates ${{ matrix.os }} ${{ matrix.shard }}/5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        shard: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      BEND_NO_TELEMETRY: '1'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned
      - name: Run gate shard
        run: >-
          python3 tools/run_gates.py --shard ${{ matrix.shard }}/5
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Upload gate results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gates-${{ matrix.os }}-${{ matrix.shard }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/gates/*.json
            .build/*-probe/results.json
            .build/conformance.json

  conformanceUbuntu:
    name: CPU and JavaScript (ubuntu-24.04)
    if: ${{ always() }}
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate shard on both OSes
        env:
          GATES_RESULT: ${{ needs.gates.result }}
        run: test "$GATES_RESULT" = success

  conformanceMac:
    name: CPU and JavaScript (macos-15)
    if: ${{ always() }}
    needs: [gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate shard on both OSes
        env:
          GATES_RESULT: ${{ needs.gates.result }}
        run: test "$GATES_RESULT" = success
