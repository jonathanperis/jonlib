          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Independently audit the public API catalog
        run: >-
          python3 tools/api_plan.py check --clang-audit
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify binary 8/16-bit PGM and PPM pixels
        run: >-
          python3 tools/pnm_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw and PackBits PSD alpha profiles
        run: >-
          python3 tools/psd_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Check the compiler overlay against upstream regressions
        run: >-
          python3 tools/verify_bend.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify PNG depth, filter, Adam7 and CgBI profiles
        run: >-
          python3 tools/png_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify exact PNG compression and formatted exports
        run: |
          python3 tools/deflate_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend" --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
          python3 tools/png_export_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend" --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw and PNG-oriented DEFLATE behavior
        run: >-
          python3 tools/inflate_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Record default-filter precision diagnostics
        run: >-
          python3 tools/filter_probe.py
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify default filtered resizing and coefficient bits
        run: >-
