  formattedUbuntu:
    name: Formatted images CPU and JavaScript (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BEND_NO_TELEMETRY: '1'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read pinned dependencies
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pins = json.loads(Path('toolchain.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('bend=' + pins['bend']['revision'], file=output)
              print('raylib=' + pins['raylib']['revision'], file=output)
              print('bun=' + pins['bun']['version'], file=output)
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Check out pinned Bend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bendlang/bend
          ref: ${{ steps.pins.outputs.bend }}
          path: .build/dependencies/bend
          persist-credentials: false
      - name: Check out pinned raylib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raysan5/raylib
          ref: ${{ steps.pins.outputs.raylib }}
          path: .build/dependencies/raylib
          persist-credentials: false
      - name: Apply the declared Bend compiler overlay
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          overlay = json.loads(Path('toolchain.json').read_text())['bend']['patch']
          patch = Path(overlay['path']).resolve()
          if hashlib.sha256(patch.read_bytes()).hexdigest() != overlay['sha256']:
              raise SystemExit('Compiler patch hash mismatch')
          source = Path('.build/dependencies/bend').resolve()
          subprocess.run(['git', '-C', str(source), 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', '-C', str(source), 'apply', str(patch)], check=True)
          PY
      - name: Verify checked formatted BMP bytes and typed IO
        run: >-
          python3 tools/formatted_bmp_export_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify checked formatted TGA bytes and typed IO
        run: >-
          python3 tools/formatted_tga_export_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify checked formatted QOI bytes, source rejection and typed IO
        run: >-
          python3 tools/formatted_qoi_export_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native QOI formats and exact memory bytes
        run: >-
          python3 tools/qoi_format_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native PNM formats and exact reduced memory bytes
        run: >-
          python3 tools/pnm_format_probe.py --reference-env clean-loader
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify format-preserving PNM file loading and bounded closure
        run: >-
          python3 tools/pnm_file_probe.py --reference-env clean-loader
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify original-format QOI files and descriptor closure
        run: >-
          python3 tools/qoi_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native PIC formats and exact memory bytes
        run: >-
          python3 tools/pic_format_probe.py --reference-env clean-loader
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Upload scoped conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-ubuntu-24.04-formatted
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .build/formatted-bmp-export-probe/
            .build/formatted-tga-export-probe/
            .build/formatted-qoi-export-probe/
            .build/qoi-format-probe/
            .build/pnm-format-probe/
            .build/pnm-file-probe/results.json
            .build/pnm-file-probe/run-*/*.command.json
            .build/pnm-file-probe/run-*/*.resource.json
            .build/qoi-file-probe/results.json
            .build/qoi-file-probe/run-*/inputs.json
            .build/qoi-file-probe/run-*/*.bend
            .build/qoi-file-probe/run-*/*.c
            .build/qoi-file-probe/run-*/*.stdout
            .build/qoi-file-probe/run-*/*.stderr
            .build/qoi-file-probe/run-*/*.command.json
            .build/qoi-file-probe/run-*/*.resource.json
            .build/pic-format-probe/

