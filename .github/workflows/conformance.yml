name: Conformance

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coreUbuntu:
    name: Core CPU and JavaScript (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BEND_NO_TELEMETRY: '1'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read pinned dependencies
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pins = json.loads(Path('toolchain.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('bend=' + pins['bend']['revision'], file=output)
              print('raylib=' + pins['raylib']['revision'], file=output)
              print('bun=' + pins['bun']['version'], file=output)
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Check out pinned Bend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bendlang/bend
          ref: ${{ steps.pins.outputs.bend }}
          path: .build/dependencies/bend
          persist-credentials: false
      - name: Check out pinned raylib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raysan5/raylib
          ref: ${{ steps.pins.outputs.raylib }}
          path: .build/dependencies/raylib
          persist-credentials: false
      - name: Apply the declared Bend compiler overlay
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          overlay = json.loads(Path('toolchain.json').read_text())['bend']['patch']
          patch = Path(overlay['path']).resolve()
          if hashlib.sha256(patch.read_bytes()).hexdigest() != overlay['sha256']:
              raise SystemExit('Compiler patch hash mismatch')
          source = Path('.build/dependencies/bend').resolve()
          subprocess.run(['git', '-C', str(source), 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', '-C', str(source), 'apply', str(patch)], check=True)
          PY
      - name: Verify checked R32 RAW loading and bounded resource use
        run: >-
          python3 tools/r32_raw_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify bounded RGB-float to R32 conversion and owners
        run: >-
          python3 tools/float_rgb_r32_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Record native math host profiles (diagnostic, not parity)
        run: >-
          python3 tools/native_math_profile_probe.py
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
          --clang clang
      - name: Verify isolated exact finite binary64 narrowing
        run: >-
          python3 tools/binary64_narrow_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify isolated bounded binary64 fused multiply-add
        run: >-
          python3 tools/binary64_fma_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify isolated bounded binary64 addition and subtraction
        run: >-
          python3 tools/binary64_add_sub_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify isolated checked normal binary64 operations and words
        run: >-
          python3 tools/binary64_ops_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify isolated gradual-output binary64 multiplication
        run: >-
          python3 tools/binary64_gradual_multiply_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify private pinned finite modern atan2 kernel
        run: |
          python3 tools/modern_angle_bounds.py
          python3 tools/modern_angle_probe.py --reference-loader-policy clean-loader --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Qualify frozen native angle contract (Linux ELF metadata profile)
        if: runner.os == 'Linux'
        run: |
          python3 tools/angle_manifest_audit.py
          python3 tools/angle_reference.py --reference-loader-policy clean-loader --raylib-source "${{ github.workspace }}/.build/dependencies/raylib" --library .build/raylib/raylib/libraylib.a
      # The checked-wrapper gate currently exercises the freshly qualified modern
      # Linux ELF profile. A different numerical contract is not silently retargeted.
      - name: Verify checked modern angle wrappers (qualified Linux context)
        if: runner.os == 'Linux'
        run: |
          profile=$(python3 -c 'import json; print(json.load(open(".build/angle-reference/results.json"))["selected_profile"])')
          if [ "$profile" = Glibc241AngleRn ]; then
            python3 tools/checked_angle_probe.py --reference-loader-policy clean-loader --bend-source "${{ github.workspace }}/.build/dependencies/bend" --raylib-source "${{ github.workspace }}/.build/dependencies/raylib" --library .build/raylib/raylib/libraylib.a
          else
            echo "Modern checked-wrapper host gate unsupported for qualified $profile; no modern host pass claimed"
          fi
      - name: Verify unchanged legacy angle contracts and supporting arithmetic
        run: |
          python3 tools/float64_ops_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          python3 tools/angle_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend" --gnu-control
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, platform, shutil, subprocess, sys
          sys.path.insert(0, 'tools')
          import modern_angle_reference as historical
          import conformance
          import reference_environment
          # Legacy source stays byte-identical. Its inherited context is separate
          # from the qualified clean context and still faces all frozen checks.
          legacy_env = reference_environment.ReferenceEnvironment()
          modern = False
          if platform.system() == 'Linux':
              receipt = json.loads(pathlib.Path('.build/angle-reference/results.json').read_text())
              assert receipt['qualified'] is True
              modern = receipt['selected_profile'] == 'Glibc241AngleRn'
          command = [sys.executable, 'tools/angle_probe.py', '--bend-source', '${{ github.workspace }}/.build/dependencies/bend']
          harness_sources = historical.assert_pins()
          library_sources = conformance.source_gate()
          # Remove all old generated probe artifacts before this invocation.
          work = pathlib.Path('.build/angle-probe')
          if work.exists():
              shutil.rmtree(work)
          result = subprocess.run(command, capture_output=True, text=True, env=legacy_env.child())
          legacy_env.assert_unchanged()
          print(result.stdout, end='')
          print(result.stderr, file=sys.stderr, end='')
          if not modern:
              assert result.returncode == 0, 'Legacy native-angle gate failed'
          else:
              # The unchanged strict old Sun/native probe must still fail with
              # precisely the frozen historical differences, never arbitrary failure.
              assert result.returncode == 1, 'Legacy failure is not the expected mismatch verdict'
              assert 'ValueError: cpu: atan2 mismatch:' in result.stderr
              assert 'Command failed:' not in result.stderr
              work = pathlib.Path('.build/angle-probe')
              report = json.loads((work/'results.json').read_text())
              assert report['passed'] is False and report['profile'] == 'gnu' and report['reference'] == 'native-libm'
              assert report['samples'] == 1086 and report['inputs_sha256'] == historical.OLD_INPUTS_SHA256
              assert set(report['lanes']) == {'cpu'} and report['lanes']['cpu']['passed'] is False
              assert report['lanes']['cpu']['mismatch_count'] == 178
              assert report['sources'] == library_sources
              native = list(map(int, subprocess.check_output([str(work/'reference')], text=True, env=legacy_env.child()).split()))
              output = subprocess.check_output([str(work/'candidate-cpu'), '--threads', '1'], text=True)
              old = [word for line in output.splitlines() for word in json.loads(line)]
              assert len(native) == len(old) == 1086
              rows = [[i, historical.bits(y), historical.bits(x), native[i], old[i]] for i, (y,x) in enumerate(historical.old_samples())]
              differences = [row for row in rows if row[-1] != row[-2]]
              assert historical.hash_json(rows) == historical.HISTORICAL_RESULTS_SHA256
              assert historical.hash_json(differences) == historical.HISTORICAL_DIFFERENCES_SHA256
              print('Legacy contract preserved: 1086 exact historical records, 178 native differences; this is not legacy native parity')
          legacy_env.assert_unchanged()
          (work/'loader-context.json').write_text(json.dumps(dict(
              scope='separate legacy compatibility; not clean-context qualification',
              reference_environment=legacy_env.receipt()), indent=2)+'\n')
          assert conformance.source_gate() == library_sources
          assert historical.assert_pins() == harness_sources
          PYTHON
      - name: Check standalone Jonmath imports
        run: |
          bun "${{ github.workspace }}/.build/dependencies/bend/bend2/main.ts" examples/math.bend -o .build/jonmath-example -o .build/jonmath-example.js
          ./.build/jonmath-example --gpu off
          bun .build/jonmath-example.js
      # Angle-bearing canonical/Metal generation now requires fresh qualification.
      # Native reference/compiler children explicitly use a clean loader profile.
      # setup-python and Bend keep their inherited environment; no global unset.
      - name: Build and compare every pixel
        run: >-
          python3 tools/conformance.py --reference-loader-policy clean-loader
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify owned random streams, sequences and post-noise state
        run: >-
          python3 tools/random_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify Perlin tables and octave arithmetic
        run: >-
          python3 tools/perlin_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify spline points and record cubic rounding gap
        run: >-
          python3 tools/spline_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify pixel sizing and raw dithering
        run: >-
          python3 tools/pixel_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw pixel reads and writes
        run: >-
          python3 tools/raw_pixel_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify owned byte/integer and bounded R32 conversions
        run: >-
          python3 tools/image_format_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify bounded R32 ownership and image consumers
        run: >-
          python3 tools/r32_image_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw image files and descriptor closure
        run: >-
          python3 tools/raw_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify BMP pixels and exact export bytes
        run: >-
          python3 tools/bmp_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify TGA pixels and exact RLE export bytes
        run: >-
          python3 tools/tga_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native PSD matte arithmetic profiles
        run: >-
          python3 tools/psd_matte_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify Softimage PIC raw and RLE packets
        run: >-
          python3 tools/pic_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify first-frame GIF geometry, palettes and LZW
        run: >-
          python3 tools/gif_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify owned animation memory dispatch and budgets
        run: >-
          python3 tools/gif_animation_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify animation files and descriptor closure
        run: >-
          python3 tools/animation_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw and RLE HDR images and exhaustive float bits
        run: >-
          python3 tools/hdr_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify HDR float files and descriptor closure
        run: >-
          python3 tools/hdr_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify RGB float conversion and large owned exports
        run: >-
          python3 tools/float_rgb_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify RGB float raw-byte interoperability
        run: >-
          python3 tools/float_rgb_bytes_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify RGB float RAW files and ownership
        run: >-
          python3 tools/float_rgb_raw_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify RGB float copies and orientation
        run: >-
          python3 tools/float_rgb_transform_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify RGB float rectangle ownership and clipping
        run: >-
          python3 tools/float_rgb_crop_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native RGB float nearest quantization
        run: >-
          python3 tools/float_rgb_resize_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native RGB float filtered resizing
        run: >-
          python3 tools/float_rgb_resize_probe.py --filtered
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify RGB float canvas and POT behavior
        run: >-
          python3 tools/float_rgb_canvas_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native RGB float color transforms
        run: >-
          python3 tools/float_rgb_color_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify direct RGB float formats and grayscale
        run: >-
          python3 tools/float_rgb_formats_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify byte and packed images to RGB floats
        run: >-
          python3 tools/formatted_float_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native grayscale channels and retained sources
        run: >-
          python3 tools/image_channel_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native formatted and float color observations
        run: >-
          python3 tools/image_colors_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native RGB float PNG memory and file paths
        run: >-
          python3 tools/float_rgb_png_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native RGB float BMP and TGA file paths
        run: >-
          python3 tools/float_rgb_raster_export_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native byte and float image-as-code text and file ownership
        run: >-
          python3 tools/image_code_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify image-memory token and content dispatch
        run: >-
          python3 tools/image_memory_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify image-file dispatch and descriptor closure
        run: >-
          python3 tools/image_file_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify suffix-selected RGBA8 export and descriptor closure
        run: >-
          python3 tools/image_export_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Independently audit the public API catalog
        run: >-
          python3 tools/api_plan.py check --clang-audit
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify binary 8/16-bit PGM and PPM pixels
        run: >-
          python3 tools/pnm_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw and PackBits PSD alpha profiles
        run: >-
          python3 tools/psd_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Check the compiler overlay against upstream regressions
        run: >-
          python3 tools/verify_bend.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify PNG depth, filter, Adam7 and CgBI profiles
        run: >-
          python3 tools/png_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify exact PNG compression and formatted exports
        run: |
          python3 tools/deflate_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend" --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
          python3 tools/png_export_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend" --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify raw and PNG-oriented DEFLATE behavior
        run: >-
          python3 tools/inflate_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Record default-filter precision diagnostics
        run: >-
          python3 tools/filter_probe.py
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify default filtered resizing and coefficient bits
        run: >-
          python3 tools/resize_conformance.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify the bounded gradient trigonometry profile
        run: |
          python3 tools/trig_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          cp .build/trig-probe/results.json .build/trig-probe/gradient-results.json
          python3 tools/trig_probe.py --bend-source "${{ github.workspace }}/.build/dependencies/bend" --rotation
          cp .build/trig-probe/results.json .build/trig-probe/rotation-results.json
      - name: Verify native complete RGBA8 mipmap chains
        run: >-
          python3 tools/mipmap_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify finite-normal fused arithmetic
        run: >-
          python3 tools/fused_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify native RGBA8 Gaussian blur
        run: >-
          python3 tools/blur_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native RGBA8 kernel convolution
        run: >-
          python3 tools/convolution_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Record unresolved perspective rounding evidence
        run: >-
          python3 tools/perspective_probe.py
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Record unresolved inverse-trig evidence
        run: >-
          python3 tools/inverse_trig_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
      - name: Verify native bounded Base64 utilities
        run: >-
          python3 tools/base64_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native CRC32 and MD5 values
        run: >-
          python3 tools/checksum_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native SHA-1 and SHA-256 values
        run: >-
          python3 tools/sha_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native sdefl Huffman dependency
        run: >-
          python3 tools/sdeflate_huffman_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify native quality-8 LZ sequences and frequencies
        run: >-
          python3 tools/sdeflate_probe.py --stage lz
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Verify exact native raw compression and decompression
        run: >-
          python3 tools/sdeflate_probe.py
          --bend-source "${{ github.workspace }}/.build/dependencies/bend"
          --raylib-source "${{ github.workspace }}/.build/dependencies/raylib"
      - name: Upload scoped conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-ubuntu-24.04-core
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
